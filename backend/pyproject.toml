[project]
name = "wuye-vtasoftware-backend"
version = "0.1.0"
description = "基于点云预拼装的结构构件尺寸质量评定系统 - B/S 后端"
requires-python = ">=3.10.18,<3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "kaleido~=1.0.0",
  "matplotlib~=3.10.3",
  "numpy~=2.2.6",
  "open3d==0.16.0",
  "pandas~=2.3.1",
  "pillow~=11.3.0",
  "plotly~=6.2.0",
  "pylatex~=1.4.2",
  "pyransac3d~=0.6.0",
  "pyvista~=0.45.3",
  "python-multipart>=0.0.9,<1.0",
  "scikit-learn~=1.7.1",
  "scipy~=1.15.3",
  "tqdm~=4.67.1",
  "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
